<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodCal - Database Visuelle</title>
    <!-- Utilisation d'une police très moderne et géométrique -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-solid: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --border: rgba(226, 232, 240, 0.8);
            
            /* Couleurs de visualisation des calories */
            --cal-low: #10b981;
            --cal-med: #f59e0b;
            --cal-high: #ef4444;

            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 20px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.04);
            --shadow-hover: 0 20px 40px rgba(99, 102, 241, 0.1), 0 8px 16px rgba(0,0,0,0.04);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 3rem 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Fond animé (Mesh Gradient CSS) --- */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #f8fafc;
        }
        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out alternate;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #e0e7ff; animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #fce7f3; animation-delay: -5s; }
        .blob-3 { top: 40%; left: 60%; width: 40vw; height: 40vw; background: #dcfce7; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 10%) scale(1.1); }
            100% { transform: translate(-5%, -5%) scale(0.9); }
        }

        /* --- Header & Recherche --- */
        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: slideDownPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #1e293b, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 500;
        }

        .search-wrapper {
            max-width: 650px;
            margin: 0 auto 3rem auto;
            position: relative;
            animation: slideUpPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .search-container input {
            width: 100%;
            padding: 1.2rem 1.5rem 1.2rem 3.5rem;
            font-size: 1.15rem;
            font-family: inherit;
            border: 2px solid var(--border);
            border-radius: 100px;
            outline: none;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-md);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--text-main);
        }

        .search-container input::placeholder { color: #94a3b8; }

        .search-container input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 6px var(--primary-glow), var(--shadow-md);
            background: var(--surface-solid);
        }

        .search-container input:focus + .search-icon { color: var(--primary); }

        .results-info {
            text-align: center;
            margin-top: -1.5rem;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards 0.5s;
        }

        /* --- Grille de résultats --- */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* --- Design des Cartes --- */
        .card {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.8rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
            overflow: hidden;
            
            /* État initial pour l'animation */
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        .card.animate-in {
            animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .emoji-wrapper {
            position: relative;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); /* Bounce effect */
        }

        .card:hover .emoji-wrapper {
            transform: scale(1.15) rotate(10deg);
            background: #eef2ff;
        }

        .titles { flex: 1; }

        .titles h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .titles p {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .card-data {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .kcal-display {
            display: flex;
            flex-direction: column;
        }

        .kcal-number {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1px;
            color: var(--text-main);
        }

        .kcal-unit {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 4px;
        }

        .meta-info {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* --- Visualisation : Barre de densité calorique --- */
        .cal-viz {
            width: 100%;
            height: 6px;
            background: var(--bg-color);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-top: 5px;
        }

        .cal-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.5s;
            width: 0%; /* S'animera en JS */
        }

        /* --- États divers --- */
        .loading-spinner {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            animation: fadeIn 0.5s forwards;
        }

        .no-results .big-emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite alternate;
        }

        .no-results h3 { font-size: 1.5rem; color: var(--text-main); margin-bottom: 0.5rem; }
        .no-results p { color: var(--text-muted); }


        /* --- Ajouts : badges, macros, filtres --- */
        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            max-width: 900px;
            margin: 0 auto 2.5rem auto;
        }

        .chip {
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .chip:hover { color: var(--primary); border-color: rgba(99,102,241,0.4); }
        .chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 6px 14px var(--primary-glow);
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 3px 8px;
            border-radius: 8px;
            background: #eef2ff;
            color: #4f46e5;
        }
        .badge.state { background: #ecfdf5; color: #047857; }
        .badge.low { background: #fef2f2; color: #b91c1c; }

        .macros {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }
        .macro {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 0.6rem;
            text-align: center;
        }
        .macro .val {
            display: block;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2;
        }
        .macro .lbl {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .extra {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 1rem;
        }

        .load-more {
            grid-column: 1 / -1;
            justify-self: center;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            background: var(--surface-solid);
            border: 2px solid var(--border);
            border-radius: 100px;
            padding: 0.9rem 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .load-more:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .macros { grid-template-columns: repeat(3, 1fr); }
        }

        /* --- Animations --- */
        @keyframes slideDownPop {
            0% { opacity: 0; transform: translateY(-40px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideUpPop {
            0% { opacity: 0; transform: translateY(40px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes cardEnter {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            body { padding: 2rem 1rem; }
            .results-grid { grid-template-columns: 1fr; gap: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Fond ambiant animé -->
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header>
        <h1>FoodCal.</h1>
        <p>Explorez la valeur nutritionnelle de vos aliments</p>
    </header>

    <main>
        <div class="search-wrapper">
            <div class="search-container">
                <!-- SVG Icon Recherche -->
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Rechercher (ex: Avocat, Saumon, Riz...)" autocomplete="off">
            </div>
        </div>

        <div class="filters" id="filters"></div>

        <div class="results-info" id="resultsCount"></div>

        <div class="results-grid" id="resultsGrid">
            <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
    </main>

    <script>
        // ---------------------------------------------------------------
        // Nouveau format Open-food-calories.json :
        // { id, name: {fr, en}, category, state, type, kcal_per_100g,
        //   protein_g, fat_g, carbs_g, fiber_g, sugars_g, saturated_fat_g,
        //   salt_g, alcohol_g, weight_per_unit, emoji, source, confidence }
        // ---------------------------------------------------------------

        let foodDatabase = [];   // données normalisées
        let currentData = [];    // résultat courant (filtré)
        let visibleCount = 0;    // pagination progressive
        const PAGE_SIZE = 60;

        let activeCategory = 'all';
        let searchTerm = '';

        const searchInput = document.getElementById('searchInput');
        const resultsGrid = document.getElementById('resultsGrid');
        const resultsCount = document.getElementById('resultsCount');
        const filtersBox = document.getElementById('filters');

        const MAX_KCAL_REF = 900;

        const CATEGORY_LABELS = {
            all: '🍽️ Tout',
            fruits: '🍎 Fruits',
            vegetables: '🥦 Légumes',
            grains: '🌾 Céréales',
            meat: '🥩 Viandes',
            seafood: '🐟 Poissons',
            dairy_eggs: '🥚 Produits laitiers & œufs',
            legumes: '🫘 Légumineuses',
            nuts_seeds: '🥜 Fruits à coque',
            fats_oils: '🫒 Matières grasses',
            sweets: '🍫 Sucreries',
            beverages: '🥤 Boissons',
            condiments: '🧂 Condiments',
            prepared: '🍱 Plats préparés',
            uncategorized: '❓ Autres'
        };

        const STATE_LABELS = { raw: 'Cru', cooked: 'Cuit', dried: 'Séché', frozen: 'Surgelé', canned: 'Conserve' };
        const TYPE_LABELS  = { solid: 'Aliment solide', liquid: 'Liquide', unit: 'À l\'unité' };

        // Normalisation : accepte le nouveau format ET l'ancien (name / english_name)
        function normalize(item) {
            const nameFr = (item.name && typeof item.name === 'object')
                ? (item.name.fr || item.name.en || item.id || '')
                : (item.name || '');
            const nameEn = (item.name && typeof item.name === 'object')
                ? (item.name.en || '')
                : (item.english_name || '');

            const num = v => (v === null || v === undefined || v === '' || isNaN(v)) ? null : Number(v);

            return {
                id: item.id || nameFr,
                nameFr,
                nameEn,
                category: item.category || 'uncategorized',
                state: item.state || null,
                type: item.type || 'solid',
                kcal: num(item.kcal_per_100g) ?? 0,
                protein: num(item.protein_g),
                fat: num(item.fat_g),
                carbs: num(item.carbs_g),
                fiber: num(item.fiber_g),
                sugars: num(item.sugars_g),
                satFat: num(item.saturated_fat_g),
                salt: num(item.salt_g),
                alcohol: num(item.alcohol_g),
                weightPerUnit: num(item.weight_per_unit),
                emoji: item.emoji || '🍽️',
                source: item.source || null,
                confidence: item.confidence || null,
                search: stripAccents((nameFr + ' ' + nameEn + ' ' + (item.id || '')).toLowerCase())
            };
        }

        function stripAccents(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function fmt(v, unit) {
            if (v === null) return null;
            const rounded = Math.round(v * 10) / 10;
            return rounded + (unit || '');
        }

        async function loadData() {
            try {
                const response = await fetch('data/Open-food-calories.json');
                if (!response.ok) throw new Error("Fichier introuvable");
                const raw = await response.json();
                // Tolère soit un tableau, soit { foods: [...] } / { data: [...] }
                const list = Array.isArray(raw) ? raw : (raw.foods || raw.data || raw.items || []);
                foodDatabase = list.map(normalize);
                buildFilters();
                applyFilters();
            } catch (error) {
                console.error(error);
                resultsGrid.innerHTML = `
                    <div class="no-results">
                        <div class="big-emoji">🔌</div>
                        <h3>Erreur de chargement</h3>
                        <p>Impossible de charger la base (data/Open-food-calories.json).</p>
                    </div>`;
                resultsCount.innerText = "";
            }
        }

        // Construit les puces de catégories présentes dans le fichier
        function buildFilters() {
            const counts = {};
            foodDatabase.forEach(f => { counts[f.category] = (counts[f.category] || 0) + 1; });

            const order = Object.keys(CATEGORY_LABELS).filter(c => c === 'all' || counts[c]);
            Object.keys(counts).forEach(c => { if (!order.includes(c)) order.push(c); });

            filtersBox.innerHTML = order.map(cat => {
                const label = CATEGORY_LABELS[cat] || cat;
                const n = cat === 'all' ? foodDatabase.length : counts[cat];
                return `<button class="chip ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">${label} <span style="opacity:.6">${n}</span></button>`;
            }).join('');

            filtersBox.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    activeCategory = chip.dataset.cat;
                    filtersBox.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
                    applyFilters();
                });
            });
        }

        function getCalColor(kcal) {
            if (kcal < 100) return 'var(--cal-low)';
            if (kcal < 300) return 'var(--cal-med)';
            return 'var(--cal-high)';
        }

        function createCardHTML(food, index) {
            const percentage = Math.min((food.kcal / MAX_KCAL_REF) * 100, 100);
            const color = getCalColor(food.kcal);
            const delay = Math.min(index * 0.03, 0.6).toFixed(2);

            const metaHTML = (food.weightPerUnit && food.weightPerUnit > 0)
                ? `~ ${food.weightPerUnit} g / unité`
                : (TYPE_LABELS[food.type] || food.type);

            const badges = [];
            badges.push(`<span class="badge">${(CATEGORY_LABELS[food.category] || food.category).replace(/^\S+\s/, '')}</span>`);
            if (food.state) badges.push(`<span class="badge state">${STATE_LABELS[food.state] || food.state}</span>`);
            if (food.confidence === 'low') badges.push(`<span class="badge low">Estimation</span>`);

            const macro = (val, lbl) => `
                <div class="macro">
                    <span class="val">${val === null ? '–' : fmt(val, '')}<span style="font-size:.75rem;font-weight:600">${val === null ? '' : ' g'}</span></span>
                    <span class="lbl">${lbl}</span>
                </div>`;

            const extras = [
                food.fiber !== null ? `Fibres ${fmt(food.fiber, ' g')}` : null,
                food.sugars !== null ? `Sucres ${fmt(food.sugars, ' g')}` : null,
                food.satFat !== null ? `AG saturés ${fmt(food.satFat, ' g')}` : null,
                food.salt !== null ? `Sel ${fmt(food.salt, ' g')}` : null,
                food.alcohol ? `Alcool ${fmt(food.alcohol, ' g')}` : null
            ].filter(Boolean);

            return `
                <div class="card animate-in" style="animation-delay: ${delay}s">
                    <div class="card-header">
                        <div class="emoji-wrapper">${food.emoji}</div>
                        <div class="titles">
                            <h2>${food.nameFr}</h2>
                            ${food.nameEn ? `<p>${food.nameEn}</p>` : ''}
                            <div class="badges">${badges.join('')}</div>
                        </div>
                    </div>

                    <div class="card-data">
                        <div class="kcal-display">
                            <span class="kcal-number" style="color: ${color}">${food.kcal}</span>
                            <span class="kcal-unit">kcal pour 100 g</span>
                        </div>
                        <div class="meta-info">${metaHTML}</div>
                    </div>

                    <div class="cal-viz">
                        <div class="cal-bar" data-target="${percentage}" style="background-color: ${color};"></div>
                    </div>

                    <div class="macros">
                        ${macro(food.protein, 'Protéines')}
                        ${macro(food.carbs, 'Glucides')}
                        ${macro(food.fat, 'Lipides')}
                    </div>

                    ${extras.length ? `<div class="extra">${extras.map(e => `<span>${e}</span>`).join('')}</div>` : ''}
                </div>
            `;
        }

        function applyFilters() {
            const q = stripAccents(searchTerm.toLowerCase().trim());

            currentData = foodDatabase.filter(f => {
                if (activeCategory !== 'all' && f.category !== activeCategory) return false;
                return q === '' || f.search.includes(q);
            });

            if (q) {
                currentData.sort((a, b) => {
                    const aStarts = a.search.startsWith(q) ? 0 : 1;
                    const bStarts = b.search.startsWith(q) ? 0 : 1;
                    if (aStarts !== bStarts) return aStarts - bStarts;
                    return a.nameFr.length - b.nameFr.length;
                });
            }

            visibleCount = 0;
            resultsGrid.innerHTML = '';
            renderMore(true);
        }

        function renderMore(reset) {
            if (currentData.length === 0) {
                resultsGrid.innerHTML = `
                    <div class="no-results">
                        <div class="big-emoji">👻</div>
                        <h3>Aucun résultat</h3>
                        <p>Essayez avec un autre terme ou une autre catégorie.</p>
                    </div>`;
                resultsCount.innerText = "0 aliment trouvé";
                return;
            }

            const oldBtn = resultsGrid.querySelector('.load-more');
            if (oldBtn) oldBtn.remove();

            const slice = currentData.slice(visibleCount, visibleCount + PAGE_SIZE);
            const startIndex = reset ? 0 : 0;
            resultsGrid.insertAdjacentHTML('beforeend', slice.map((f, i) => createCardHTML(f, startIndex + i)).join(''));
            visibleCount += slice.length;

            resultsCount.innerText = `${visibleCount} / ${currentData.length} aliment${currentData.length > 1 ? 's' : ''}`;

            if (visibleCount < currentData.length) {
                const btn = document.createElement('button');
                btn.className = 'load-more';
                btn.textContent = `Afficher ${Math.min(PAGE_SIZE, currentData.length - visibleCount)} de plus`;
                btn.addEventListener('click', () => renderMore(false));
                resultsGrid.appendChild(btn);
            }

            // Animation des barres après insertion dans le DOM
            requestAnimationFrame(() => {
                resultsGrid.querySelectorAll('.cal-bar').forEach(bar => {
                    bar.style.width = bar.dataset.target + '%';
                });
            });
        }

        let debounce;
        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            clearTimeout(debounce);
            debounce = setTimeout(applyFilters, 120);
        });

        loadData();
    </script>
</body>
</html>
